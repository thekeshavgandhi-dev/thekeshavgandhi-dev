name: Generate Contribution Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate animated SVG
        run: node scripts/generate-svg.cjs
        env:
          OUTPUT_DIR: assets
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIBUTION_USERNAME: ${{ github.repository_owner }}

      # 🛑 CRITICAL CHANGE: REPLACE THE 'uses' STEP WITH THIS 'run' BLOCK
      - name: Commit and push SVG
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/*-contribution-animation*.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update contribution animation [skip ci]"
          git pull --rebase
          git push
