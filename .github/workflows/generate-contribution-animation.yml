name: Generate Contribution Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate animated SVG
        run: node scripts/generate-svg.cjs
        env:
          OUTPUT_DIR: assets
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIBUTION_USERNAME: ${{ github.repository_owner }}

      - name: Commit and push SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update contribution animation [skip ci]'
          file_pattern: "assets/*-contribution-animation*.svg"
          pull: 'true'
